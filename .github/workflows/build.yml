name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' 
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Added pillow so PyInstaller can auto-convert the png to ico for Windows
        pip install requests PyQt6 pyinstaller pillow
        
    - name: Build Executable with PyInstaller
      run: pyinstaller --onefile --windowed --add-data "surah.json;." --add-data "clean_root_reciters.json;." --add-data "logo.png;." --icon="logo.png" quran_downloader_gui.py
      
    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Quran-Downloader-Windows-EXE
        path: dist/*.exe
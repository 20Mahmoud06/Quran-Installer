name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests arabic-reshaper python-bidi pyinstaller
        
    - name: Build Executable with PyInstaller
      run: pyinstaller --onefile --windowed quran_downloader_gui.py
      
    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Quran-Downloader-Windows-EXE
        path: dist/*.exe